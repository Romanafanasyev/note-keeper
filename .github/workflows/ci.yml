name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHANNEL_ID: -1001234567890
      USER_ID: 123456789

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Prepare test environment
        env:
          TOKEN_SUFFIX: test_token_value_long_enough_for_validation
        run: echo "BOT_TOKEN=123456789:${TOKEN_SUFFIX}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Check formatting
        run: |
          python -m black --check .
          python -m isort --check-only .
          python -m flake8 .

      - name: Run tests
        run: python -m pytest

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Build production image
        run: docker build --platform linux/amd64 -t planbot:test .
